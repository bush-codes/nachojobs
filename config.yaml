resume_path: "resume/Resume - EM - Chris Bush.pdf"
output_dir: "output"
freshness_days: 14

schedule:
  interval_hours: 12
  run_on_startup: true

ollama:
  base_url: "http://localhost:11434"
  model: "llama3.1:8b"
  timeout_seconds: 120
  top_k_matches: 3

target_roles:
