[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachojobs"
version = "0.1.0"
description = "Fetch tech jobs from Ashby + Greenhouse, rank against resume with local LLM"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "apscheduler>=3.10,<4",
    "pymupdf>=1.25",
    "beautifulsoup4>=4.12",
    "ollama>=0.4",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio"]

[project.scripts]
nachojobs = "nachojobs.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nachojobs"]
